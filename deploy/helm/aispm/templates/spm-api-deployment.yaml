# deploy/helm/aispm/templates/spm-api-deployment.yaml
# Uses the spm-api ServiceAccount — carries the RBAC token to create/delete
# agent Pods in aispm-agents namespace. AGENT_CODE_HOST_DIR is not used in
# k8s — agent code is stored in ConfigMaps (see agent_controller.py Task 11).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spm-api
  namespace: {{ .Values.global.namespace }}
spec:
  # 2 replicas + topology spread = no SPOF.  Both replicas run
  # ensure_schema (alembic upgrade head) on lifespan; alembic's
  # migration lock ensures only one applies migrations at a time.
  # Pod-spawn requests via agent_controller are idempotent.
  replicas: {{ .Values.spmApi.replicas | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: spm-api }
  template:
    metadata:
      labels: { app: spm-api }
    spec:
      serviceAccountName: spm-api
      containers:
        - name: spm-api
          image: {{ include "aispm.image" .Values.images.spmApi }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: platform-env
            - secretRef:
                name: platform-secrets
          env:
            # Hits CNPG primary directly via spmDb.externalName instead
            # of the chart's `spm-db.<ns>.svc.cluster.local` ExternalName
            # alias. The alias works most of the time but its CNAME-
            # follow has been flaky for some asyncpg connections; one
            # fewer DNS hop here removes a real failure mode. Pairs with
            # the same change in templates/secrets.yaml so the value in
            # platform-secrets and the per-container override agree.
            # May 2026 incident.
            - name: SPM_DB_URL
              value: "postgresql+asyncpg://{{ .Values.spmDb.user }}:$(SPM_DB_PASSWORD)@{{ .Values.spmDb.externalName }}:5432/{{ .Values.spmDb.database }}"
            - name: FREEZE_CONTROLLER_URL
              value: "http://freeze-controller.{{ .Values.global.namespace }}.svc.cluster.local:8090"
            - name: CPM_API_URL
              value: "http://api.{{ .Values.global.namespace }}.svc.cluster.local:8080"
            - name: POLICY_SIMULATOR_URL
              value: "http://policy-simulator.{{ .Values.global.namespace }}.svc.cluster.local:8091"
            - name: MODEL_UPLOAD_DIR
              value: /app/models
            - name: AGENT_POD_NAMESPACE
              value: {{ .Values.agentRuntime.namespace | quote }}
            - name: AGENT_RUNTIME_IMAGE
              value: {{ include "aispm.image" .Values.images.agentRuntime | quote }}
            - name: AGENT_RUNTIME_CLASS
              value: {{ .Values.agentRuntime.runtimeClassName | default "" | quote }}
          # Explicit resources. spm-api was getting OOMKilled (Exit 137)
          # roughly every 8 minutes on dev because no limits were set
          # at the container level — the namespace LimitRange's default
          # of 512Mi was being applied silently. seed_all data + the
          # ORM session pool + uvicorn workers comfortably blow past
          # 512Mi at peak. 2Gi gives sustainable headroom on dev; prod
          # should pin its own value via .Values.spmApi.resources.
          # May 2026 incident.
          resources:
            {{- if .Values.spmApi.resources }}
            {{- toYaml .Values.spmApi.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
            {{- end }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
            - name: models
              mountPath: /app/models
          readinessProbe:
            httpGet: { path: /health, port: 8092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8092 }
            initialDelaySeconds: 40
            periodSeconds: 15
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0444
        - name: models
          persistentVolumeClaim:
            claimName: spm-api-models
