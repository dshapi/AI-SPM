# deploy/helm/aispm/templates/policy-simulator-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-simulator
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  # 2 replicas + topology spread = no SPOF: 1-pod loss leaves the
  # service serving from the other replica on a different node.
  # Override via `.Values.policySimulator.replicas` if you need more.
  replicas: {{ .Values.policySimulator.replicas | default 2 }}
  selector:
    matchLabels: { app: policy-simulator }
  template:
    metadata:
      labels: { app: policy-simulator }
    spec:
      containers:
        - name: policy-simulator
          image: {{ include "aispm.image" .Values.images.policySimulator }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: platform-env
            - secretRef:
                name: platform-secrets
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: 8091 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0444
