# deploy/helm/aispm/templates/configmap-platform-env.yaml
#
# Kafka-shape values (bootstrap server list, replication factor, min ISR)
# are derived from .Values.kafka.replicas rather than hardcoded in
# .Values.platformEnv so the same chart works for single-broker dev and
# multi-broker prod. Same pattern as KAFKA_CONTROLLER_QUORUM_VOTERS in
# the Kafka StatefulSet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-env
  namespace: {{ .Values.global.namespace }}
data:
  {{- range $k, $v := .Values.platformEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  # Bootstrap server list scaled to kafka.replicas. Each headless-DNS
  # entry is `kafka-<i>.kafka.<ns>.svc.cluster.local:9092`. Clients auto-
  # discover the rest of the cluster after connecting to any one.
  KAFKA_BOOTSTRAP_SERVERS: "{{- range $i, $_ := until (int .Values.kafka.replicas) }}{{ if $i }},{{ end }}kafka-{{ $i }}.kafka.{{ $.Values.global.namespace }}.svc.cluster.local:9092{{- end }}"
  # Replication factor for user-created topics — bounded by broker count.
  # 1 broker → RF=1; 3 brokers → RF=3.
  KAFKA_REPLICATION_FACTOR: {{ .Values.kafka.replicas | quote }}
  # NOTE: KAFKA_NUM_PARTITIONS already defined via .Values.platformEnv —
  # added there because spm-api needs it for create_agent_topics().
  # Don't redefine here or the configmap gets duplicate keys.
  # min.insync.replicas — defaults to 2 so a 3-broker cluster (the only
  # supported topology since May 2026) tolerates 1 broker loss without
  # dropping below the ISR threshold.  Override only if you really know
  # what you're doing — RF=3, ISR=2 is the always-on contract.
  KAFKA_MIN_INSYNC_REPLICAS: {{ .Values.kafka.minInsyncReplicas | default 2 | quote }}
  # Sentinel-aware Redis client config — replaces the haproxy-based
  # redis-master proxy that flapped under istio sidecar pooling. Each
  # redis-node pod runs a sentinel sidecar at port 26379. Listing all
  # 3 gives clients multiple discovery endpoints (any one being up is
  # enough to find the master). Master name is the Bitnami chart default.
  # Code path: platform_shared/redis.py:get_redis_client().
  REDIS_SENTINEL_HOSTS: "{{- range $i, $_ := until (int .Values.redis.replicas | default 3) }}{{ if $i }},{{ end }}redis-node-{{ $i }}.redis-headless.{{ $.Values.global.namespace }}.svc.cluster.local:26379{{- end }}"
  REDIS_SENTINEL_MASTER: {{ .Values.redis.sentinelMasterName | default "mymaster" | quote }}
  JWT_PRIVATE_KEY_PATH: /keys/private.pem
  JWT_PUBLIC_KEY_PATH: /keys/public.pem
  KEYS_DIR: /keys
