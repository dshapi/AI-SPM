# deploy/helm/aispm/templates/secrets.yaml
# Values are injected via Rancher Secrets UI or --set flags at deploy time.
# NEVER commit real values — this template uses safe defaults only.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  SPM_DB_PASSWORD: {{ .Values.secrets.spmDbPassword | default "spmpass" | quote }}
  # Full sync URL used by psycopg2 consumers (spm-aggregator, threat-hunting-agent,
  # platform_shared.integration_config).  Services that use asyncpg strip/replace
  # the scheme themselves; publishing both here avoids hardcoded fallbacks in source.
  #
  # IMPORTANT: target spmDb.externalName (CNPG primary `spm-db-rw`) directly,
  # NOT the chart's `spm-db.<ns>.svc.cluster.local` ExternalName alias.
  # The alias works for most consumers but its CNAME-follow has been flaky
  # for nc probes (db-seed init container) and some asyncpg drivers do
  # extra DNS work that the alias trips. Hitting the CNPG primary
  # directly is one fewer DNS hop and removes a real failure mode.
  # Documented incident: May 2026 — spm-llm-proxy ended up with the alias
  # URL because secrets.yaml hardcoded it; switched to externalName here
  # so platform-tier services and one-off consumers all agree.
  SPM_DB_URL: "postgresql://{{ .Values.spmDb.user }}:{{ .Values.secrets.spmDbPassword | default "spmpass" }}@{{ .Values.spmDb.externalName }}:5432/{{ .Values.spmDb.database }}"
  SPM_DB_URL_ASYNC: "postgresql+asyncpg://{{ .Values.spmDb.user }}:{{ .Values.secrets.spmDbPassword | default "spmpass" }}@{{ .Values.spmDb.externalName }}:5432/{{ .Values.spmDb.database }}"
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | default "" | quote }}
  GARAK_INTERNAL_SECRET: {{ .Values.secrets.garakInternalSecret | default "" | quote }}
  SPM_INTERNAL_BOOTSTRAP_SECRET: {{ .Values.secrets.spmInternalBootstrapSecret | default "" | quote }}
  # llm_api_key for the threat-hunting-agent system agent. Same token
  # is written into agents.llm_api_key by scripts/seed_all.py
  # (seed_system_agents) so spm-llm-proxy's _auth_required accepts the
  # agent's bearer token. Generate once with:
  #   python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
  # then pass via --set or values: secrets.threatHuntingAgentLlmKey=...
  # On rotation, update this value AND re-run db-seed Job.
  THREAT_HUNTING_AGENT_LLM_KEY: {{ .Values.secrets.threatHuntingAgentLlmKey | default "" | quote }}
# jwt-keys Secret is intentionally NOT managed by Helm.
# Create it once manually and it will survive helm upgrades/uninstalls:
#
#   kubectl create secret generic jwt-keys \
#     --from-file=private.pem=keys/private.pem \
#     --from-file=public.pem=keys/public.pem \
#     -n aispm
