# deploy/helm/aispm/templates/aispm-tls-certificate.yaml
#
# cert-manager Certificate that produces the `aispm-tls` Secret in the
# istio-system namespace.  Istio's Gateway resource (aispm-gateway,
# rendered separately) references that Secret via `credentialName:
# aispm-tls`; without the Secret, envoy can't load a TLS listener for
# port 8443 and HTTPS handshakes fail with "SSL connect error".
#
# Important: the Secret MUST live in istio-system (not aispm) because
# Istio's Gateway always reads SDS credentials from the namespace where
# the gateway proxy runs, which is istio-system.  cert-manager creates
# the Secret in whatever namespace the Certificate lives in — so the
# Certificate itself goes in istio-system too.
#
# Issuer: defaults to .Values.ingress.clusterIssuer (selfsigned for dev,
# letsencrypt-staging / letsencrypt-prod for higher environments — all
# rendered by templates/cert-manager-issuers.yaml).
#
# Documented incident: May 2026 — UI returned curl exit 35 ("SSL connect
# error") after a kind rebuild because the cert Secret didn't exist.
# Worked around by hand-generating an openssl cert; this Certificate
# resource is the proper fix so the next rebuild produces a working
# TLS endpoint without manual intervention.
#
# Second incident, May 2026 — WSS handshake failed in Safari with
# "certificate for this server is invalid". Root cause: this Certificate
# was rendered UNCONDITIONALLY (no certManager guard), so even when
# values.dev.yaml sets ingress.certManager=false (dev mode, where the
# bootstrap script populates aispm-tls from mkcert), cert-manager would
# notice the Certificate, immediately mint a fresh selfsigned cert, and
# OVERWRITE the mkcert-issued Secret. The bootstrap deletes the stale
# Certificate in its mkcert step but the chart re-applies it on the next
# `helm template | kubectl apply`, restarting the overwrite cycle.
# Guard added to match templates/cert-manager-certificate.yaml — when
# certManager=false, this template no-ops and the bootstrap's
# mkcert-managed Secret survives.
{{- if and .Values.ingress.enabled .Values.ingress.tls .Values.ingress.certManager }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aispm-tls
  namespace: istio-system
spec:
  secretName: aispm-tls
  duration: 8760h  # 1 year — selfsigned doesn't have ACME rate limits
  renewBefore: 720h  # 30 days
  subject:
    organizations:
      - aispm-dev
  commonName: {{ .Values.ingress.host | default "aispm.local" | quote }}
  dnsNames:
    - {{ .Values.ingress.host | default "aispm.local" | quote }}
  issuerRef:
    name: {{ .Values.ingress.clusterIssuer | default "selfsigned-cluster-issuer" }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
